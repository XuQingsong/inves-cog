  impact: 市场走势与晴雨表
  backfill:
    entry: manual
    max_attempts: 3
    depends_on: []
  key_column: ticker
  value_column: close
  filter:
    ticker: &id002
    - SPY
    - QQQ
    - SMH
    - SOXX
    - TQQQ
    - SOXL
    - GLD
    - HYG
    - IEF
    - TLT
