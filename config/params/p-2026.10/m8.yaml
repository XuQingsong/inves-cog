m8:
  search_daily_budget: 200
  embedding_model: text-embedding-async-v1
  embedding_dimensions: 1536
  evidence_version: v2
  evidence_weights:
    time: 20
    gradient: 20
    specificity: 15
    narrative: 15
    magnitude: 15
    alternatives: 15
  confidence:
    coverage_min: 3
    high_total: 0.70
    mid_total: 0.50
    content_components: [narrative, gradient, magnitude]
    content_min_for_high: 0.5
    specificity_cap: 0.2
  gradient:
    mechanism_exposure:
      估值倍数: 概念关联
    connection_exposure:
      业务关系: 直接
      经营传导: 间接
      市场叙事: 概念关联
      市场共振: 概念关联
    include_status: [候选, 观察到, 有支持, 已确立]
    default_exposure: 概念关联
    all_candidate_note: 关系均未经证实（候选）
  precursor:
    baseline_days: 20
    z_threshold: 2.0
    min_baseline: 10
    short_min_volume: 1000000
    occ_min_contracts: 1000
  context_items:
    min_members: 5
    min_baskets: 2
    max_items: 10
    etfs: [SPY, QQQ, DIA, IWM, SMH, SOXX, XLK, XLF, XLE, XLV, XLI]
    macro_sources: [FederalReserveNews, EIATodayInEnergy, EIANews]
  retrieval_weights:
    overlap: 0.4
    recency: 0.3
    similarity: 0.2
    source: 0.1
    overlap_blend: 0.5
    member_cover_cap: 5
  income_change_cap: {1: 1.0, 2: 0.25, 3: 0.15, 4: 0.10}
  counterparty_default_cap: {1: 1.0, 2: 0.15, 3: 0.10, 4: 0.05}
