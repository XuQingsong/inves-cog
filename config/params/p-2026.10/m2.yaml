m2:
  repair_order: [D3, D1, D2, D4, D5, D8]
  repairs: {D3: true, D1: true, D2: true, D4: true, D5: true, D8: true}
  stale_days: 180
  companyfacts_lag_days: 3
  consensus_time_beijing: '10:30'
  consensus_window_tolerance_days: 3
  segment_sum_tolerance: 0.01
  profile_consensus_change_pct: 3
  impact_matrix:
    D1:
      direct: [rev_ttm, rev_period]
      derived: [rev_growth, rev_q_yoy, rev_accel_pp, gross_margin, gross_margin_change_pp, fcf_margin, fcf_margin_change_pp, op_margin_ttm, ps, peg_rev_approx, fund_unreliable, split_suspect, data_flags]
    D2:
      direct: [rev_ttm, ni_ttm, eps_ttm, fcf_ttm, rev_period]
      derived: [rev_growth, rev_q_yoy, rev_accel_pp, eps_growth, gross_margin, gross_margin_change_pp, fcf_margin, fcf_margin_change_pp, op_margin_ttm, fcf_conversion, roe, net_debt_fcf, pe, ps, fcf_yield, peg_rev_approx, fund_unreliable, split_suspect, data_flags]
    D3:
      direct: [rev_ttm, ni_ttm, eps_ttm, cash, debt, current_ratio, shares, shares_date, rev_period]
      derived: [rev_growth, rev_q_yoy, rev_accel_pp, eps_growth, gross_margin, gross_margin_change_pp, fcf_ttm, fcf_margin, fcf_margin_change_pp, op_margin_ttm, fcf_conversion, roe, net_debt, net_debt_fcf, pe, ps, fcf_yield, peg_rev_approx, mktcap_asof, fund_unreliable, split_suspect, data_flags]
    D4:
      direct: [gross_margin]
      derived: [gross_margin_change_pp, split_suspect, data_flags]
    D5:
      direct: [ni_ttm]
      derived: [fcf_conversion, roe]
    D8:
      direct: [net_debt]
      derived: [net_debt_fcf]
  fx:
    source: FRED
    series: {EUR: DEXUSEU, TWD: DEXTAUS, KRW: DEXKOUS}
    flow_method: mean_daily_usd_per_currency
    balance_method: end_of_period_last_effective_observation
    missing_policy: stop_conversion_with_specific_gap
