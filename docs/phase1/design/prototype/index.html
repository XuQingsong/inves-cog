<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inves·cog 投资者页面 · 交互原型 v1</title>
<style>
:root{
  --canvas:#F5F3EE; --card:#FFFFFF; --line:#E7E2D8; --line2:#F0ECE4;
  --ink:#1F2A2A; --ink2:#4E5958; --muted:#8A918F;
  --brand:#23705E; --brand-bg:#E6F1EC;
  --up:#25804F; --down:#C0392B;
  --r-hi:#8E2350; --r-hi-bg:#F8E4EC; --r-hi-line:#B8346A;
  --r-mid:#8A5A00; --r-mid-bg:#FDF0D8; --r-mid-line:#D08A16;
  --tp:#2D5F86; --tp-bg:#E5EEF6; --tp-line:#3C78A8;
  --ref:#7C8583; --gap-bg:#F3F1EC;
  --mono:"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.55 var(--sans)}
a{color:var(--brand);text-decoration:none} a:hover{text-decoration:underline}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)} .ink2{color:var(--ink2)}
small,.small{font-size:12px}
/* header */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 32px;display:flex;align-items:center;gap:24px}
.brand b{font-size:18px;letter-spacing:.5px} .brand div{font-size:12px;color:var(--muted)}
.nav{display:flex;gap:6px;flex:1}
.nav a{display:block;padding:8px 14px;border-radius:10px;color:var(--ink);min-width:150px}
.nav a small{display:block;color:var(--muted)}
.nav a.on{background:var(--brand-bg);color:var(--brand)} .nav a:hover{text-decoration:none;background:var(--line2)}
.nav .badges{margin-left:6px;white-space:nowrap} .nav a{white-space:nowrap}
.dot{display:inline-block;min-width:20px;padding:0 6px;border-radius:9px;font-size:11px;line-height:18px;text-align:center;font-family:var(--mono)}
.dot.hi{background:var(--r-hi-bg);color:var(--r-hi)} .dot.mid{background:var(--r-mid-bg);color:var(--r-mid)}
.datebox{text-align:right}
.datebox .row{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.datebox button{border:1px solid var(--line);background:#fff;border-radius:8px;width:28px;height:28px;cursor:pointer;color:var(--ink2)}
.datebox button:hover{background:var(--line2)}
.datebox .d{font-family:var(--mono);font-size:15px;padding:0 4px}
.fresh{font-size:12px;color:var(--muted)}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:6px}
.mode button{border:0;background:#fff;padding:2px 8px;font-size:12px;cursor:pointer;color:var(--ink2);width:auto;height:auto;border-radius:0}
.mode button.on{background:var(--ink);color:#fff}
/* layout */
main{max-width:1280px;margin:0 auto;padding:24px 32px 48px}
.crumb{font-size:12px;color:var(--muted)}
h1{font-size:28px;margin:4px 0 4px;font-weight:650;letter-spacing:.2px}
h2{font-size:18px;margin:0 0 12px;font-weight:650}
h3{font-size:15px;margin:0 0 8px;font-weight:650}
.sub{color:var(--ink2);margin:0}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:1fr 1fr}
.g-main{grid-template-columns:2fr 1fr}
.card{background:var(--card);border-radius:14px;padding:20px 24px;border:1px solid var(--line2)}
.card.tight{padding:14px 18px}
.sec{margin-top:20px}
.kpi .l{font-size:12px;color:var(--muted)} .kpi .v{font:600 30px/1.2 var(--mono);margin:6px 0 4px} .kpi .ft{font-size:12px;color:var(--muted)}
.banner{border-radius:12px;padding:12px 16px;margin:12px 0;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--r-mid-bg);color:#5E3E00;border:1px solid #F1D9A8}
.banner.info{background:var(--tp-bg);color:#234A69;border:1px solid #CADBEA}
.banner b{white-space:nowrap}
.gap{background:var(--gap-bg);border:1px dashed #CFC8BA;border-radius:8px;padding:6px 10px;font-size:12px;color:var(--ink2);display:inline-block}
/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:1px 8px;font-size:12px;line-height:20px;white-space:nowrap}
.chip.hi{background:var(--r-hi-bg);color:var(--r-hi)} .chip.mid{background:var(--r-mid-bg);color:var(--r-mid)}
.chip.tp{background:var(--tp-bg);color:var(--tp)} .chip.ok{background:var(--line2);color:var(--ink2)}
.chip.miss{background:var(--gap-bg);color:var(--muted);border:1px dashed #CFC8BA}
.chip.stale{background:#FFF7E8;color:#8A5A00;border:1px dashed #E5C07B}
.chip.held{background:var(--brand-bg);color:var(--brand)} .chip.buy{background:#EEF4E6;color:#4F6B1F}
.ico{display:inline-flex;width:22px;height:22px;border-radius:6px;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.ico.hi{background:var(--r-hi-bg);color:var(--r-hi)} .ico.mid{background:var(--r-mid-bg);color:var(--r-mid)} .ico.tp{background:var(--tp-bg);color:var(--tp)}
/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.f{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink2)}
.f:hover{background:var(--line2)} .f.on{background:var(--brand-bg);border-color:#BFDCCF;color:var(--brand)}
.f .c{font-family:var(--mono);margin-left:4px;color:var(--muted)}
select.f,input.f{padding:5px 10px;font:13px var(--sans)}
/* risk list */
.rlist{display:flex;flex-direction:column}
.ritem{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 8px;border-radius:10px;cursor:pointer}
.ritem:hover{background:var(--line2)}
.ritem .t{font-weight:600} .ritem .s{font-size:12px;color:var(--ink2)}
.ritem .go{font-size:12px;color:var(--brand);opacity:0;align-self:center} .ritem:hover .go{opacity:1}
.rgroup{font-size:12px;color:var(--muted);margin:8px 0 2px 8px;letter-spacing:.5px}
.more{font-size:13px;color:var(--brand);cursor:pointer;margin:6px 8px;display:inline-block}
/* bars */
.bar{height:6px;background:var(--line2);border-radius:3px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--brand)}
.bar .th{position:absolute;top:-3px;width:1px;height:12px;background:#B9B2A4}
.conc{display:grid;grid-template-columns:1fr 60px;gap:4px 10px;align-items:center;margin:8px 0}
.gate{margin-top:14px}
.gate .track{position:relative;height:28px}
.gate .axis{position:absolute;left:0;right:0;top:12px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--r-hi-bg),var(--r-mid-bg) 45%,var(--line2) 80%)}
/* table */
table{width:100%;border-collapse:collapse}
th{font-weight:500;font-size:12px;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th.s{cursor:pointer;user-select:none} th.s:hover{color:var(--ink)} th.s.on{color:var(--brand)}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
td.r,th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:#FBFAF7}
/* holdings */
.hrow{display:grid;grid-template-columns:130px 175px 1fr 270px 20px;gap:16px;padding:14px 18px;border-top:1px solid var(--line2);cursor:pointer;align-items:center}
.hrow:hover{background:#FBFAF7}
.hrow.open{background:#FAFCFB}
.hrow .tk{font:600 16px var(--mono)} .hrow .ty{font-size:12px;color:var(--muted)}
.hrow .px{font-family:var(--mono);font-size:13px} .hrow .pl{font:600 15px var(--mono)}
.hrow .nx{font-size:13px} .hrow .nx .lead{font-weight:600;margin:3px 0 1px}
.caret{color:var(--muted);transition:transform .15s} .open .caret{transform:rotate(90deg)}
.hhead{display:grid;grid-template-columns:130px 175px 1fr 270px 20px;gap:16px;padding:8px 18px;font-size:12px;color:var(--muted);background:#FAF8F4;border-top:1px solid var(--line)}
.detail{display:none;padding:4px 18px 18px 18px;background:#FAFCFB;border-top:1px dashed var(--line)}
.detail.show{display:block}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.rule{border-radius:10px;padding:10px 14px;border:1px solid var(--line);background:#fff;border-left-width:4px}
.rule .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.rule .n{font-weight:600}
.rule .v{font-family:var(--mono);font-size:13px;margin-top:4px}
.rule .x{font-size:12px;color:var(--ink2);margin-top:2px}
.rule.st-none{border-left-color:#CFC8BA}
.rule.st-pending{border-left-color:var(--r-hi-line);background:#FFFAFC}
.rule.st-hold{border-left-color:var(--r-mid-line);background:#FFFCF5}
.rule.st-done{border-left-color:#B9B2A4;background:#F7F6F3}
.rule.st-done .n,.rule.st-done .v{color:var(--ink2)}
.stc{font-size:11px;border-radius:5px;padding:0 6px;line-height:18px;white-space:nowrap}
.st-none .stc{background:var(--line2);color:var(--ink2)}
.st-pending .stc{background:var(--r-hi-bg);color:var(--r-hi)}
.st-hold .stc{background:var(--r-mid-bg);color:var(--r-mid)}
.st-done .stc{background:#E9E6DF;color:var(--ink2)}
.conds{margin:6px 0 0;padding:0;list-style:none;font-size:12px}
.conds li{display:flex;gap:6px} .conds .y{color:var(--up)} .conds .n2{color:var(--down)}
.flash{animation:fl 1.4s ease}
@keyframes fl{0%{background:#FFF3C4}100%{background:#FAFCFB}}
/* ruler svg */
svg text{font-family:var(--mono)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
/* status */
.status{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:#fff}
.stat:hover{border-color:#CFC8BA}
.stat .h{display:flex;justify-content:space-between;align-items:center}
.stat .w{font-size:12px;color:var(--ink2);margin-top:6px}
.stat .imp{display:none;font-size:12px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--ink2)}
.stat.open .imp{display:block}
/* misc */
.tabs{display:flex;gap:6px;margin:6px 0 0}
.event{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px;background:#fff}
.event .h{display:flex;justify-content:space-between;cursor:pointer;gap:12px}
.event .body{display:none;margin-top:10px} .event.open .body{display:block}
.tick{display:inline-block;font:12px var(--mono);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin:2px 4px 2px 0;color:var(--ink2)}
.tick.held{border-color:#BFDCCF;background:var(--brand-bg);color:var(--brand)}
.sig{font:600 13px var(--mono);color:var(--ink2);min-width:46px}
.news li{margin:4px 0} .news{padding-left:18px;margin:6px 0}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
details.method summary{cursor:pointer;color:var(--ink2);font-size:13px}
details.method{margin-top:16px}
details.method div{font-size:12px;color:var(--ink2);columns:2;column-gap:32px;margin-top:8px}
.view{display:none} .view.on{display:block}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:.92}
.gauge{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,#DCEFE4,#F3EFD9 40%,#F8DCC4 70%,#F1C3C3);margin:26px 0 22px}
.gauge .pin{position:absolute;top:-7px;width:2px;height:24px;background:var(--ink)}
.gauge .pl{position:absolute;top:-24px;transform:translateX(-50%);font:600 12px var(--mono);white-space:nowrap}
.gauge .zl{position:absolute;top:14px;font-size:11px;color:var(--muted);transform:translateX(-50%)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.ds-sw{height:44px;border-radius:8px;border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv .k{color:var(--muted)}
.m-only{display:none}
@media (max-width:760px){
  .top-in{flex-wrap:wrap;padding:10px 14px;gap:10px}
  .nav{order:3;flex-basis:100%;overflow-x:auto}
  .nav a{min-width:auto;padding:6px 10px} .nav a small{display:none}
  main{padding:14px}
  .g4{grid-template-columns:1fr 1fr} .g3,.g2,.g-main{grid-template-columns:1fr}
  .kpi .v{font-size:22px}
  .hhead{display:none}
  .hrow{grid-template-columns:1fr auto;gap:6px 10px}
  .hrow .c-ruler{grid-column:1 / -1} .hrow .c-next{grid-column:1 / -1} .hrow .caret{display:none}
  .rules{grid-template-columns:1fr}
  .status{grid-template-columns:1fr 1fr}
  h1{font-size:22px}
  .m-hide{display:none} .m-only{display:block}
  details.method div{columns:1}
}
</style>
</head>

function ruler(h,w=470){
  const pts=[];
  if(h.stop) pts.push({k:'stop',n:h.stop.n,p:h.stop.p});

  let lo=Math.min(...pts.map(x=>x.p)), hi=Math.max(...pts.map(x=>x.p)); const pad=(hi-lo)*0.05||1; lo-=pad; hi+=pad;

  const free=(ln,a,b)=>used[ln].every(([c,d])=>b+6<c||a>d+6);

  svg+=`<line x1="${L}" y1="${Y}" x2="${R}" y2="${Y}" stroke="#E2DDD3" stroke-width="4" stroke-linecap="round"/>`;
  let distTxt='';

    svg+=`<line x1="${x1}" y1="${Y}" x2="${x2}" y2="${Y}" stroke="${c}" stroke-width="5" stroke-linecap="round" opacity=".85"/>`;
    const lab=`${dist>0?'+':'−'}${Math.abs(dist).toFixed(1)}%`, lw=textW(lab), mid=(x1+x2)/2; let a=Math.max(2,Math.min(w-2-lw,mid-lw/2));
    distTxt=`<text x="${a}" y="${Y-8}" font-size="11" fill="${c}" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3">${lab}</text>`;}
  else { const ref=pts.find(x=>x.k==='ref'); if(ref){ const x1=X(h.px),x2=X(ref.p), below=h.px<ref.p, dist=below?(1-h.px/ref.p)*100:(1-ref.p/h.px)*100, warm=below||dist<10, c=warm?'var(--r-mid-line)':'#B9B2A4';
    svg+=`<line x1="${x1}" y1="${Y}" x2="${x2}" y2="${Y}" stroke="${c}" stroke-width="${warm?4:3}" stroke-dasharray="5 3" opacity=".8"/>`;
    const lab=below?`已低于 200 日线 ${dist.toFixed(1)}%`:`再跌 ${dist.toFixed(1)}% 跌破 200 日线`, lw=textW(lab), mid=(x1+x2)/2, a=Math.max(2,Math.min(w-2-lw,mid-lw/2));
    distTxt=`<text x="${a}" y="${Y-8}" font-size="11" fill="${warm?'var(--r-mid)':'var(--ref)'}" font-weight="${warm?700:400}" paint-order="stroke" stroke="#fff" stroke-width="3">${lab}</text>`;}}
  const pref={cur:['b0','b1','b2','t0'],cost:['b0','b1','b2','t0','t1'],ref:['b0','b1','b2','t0','t1','t2'],stop:['t0','t1','t2','b0','b1','b2'],tp:['t0','t1','t2','b0','b1','b2']};
  const order=pts.map(x=>({...x,x:X(x.p)})).sort((a,b)=>(a.k==='cur'?-1:b.k==='cur'?1:a.x-b.x));

function chart(t,sp){
  const s=D.series[t]; const w=760,h=220,L=56,R=w-12,T=14,B=h-24;
  const lines=[{n:'200 日线（当前）',p:sp.ma200,c:'var(--ref)',dash:'4 3'},{n:'50 日线（当前）',p:sp.ma50,c:'#B39B6B',dash:'2 3'}];
  const hh=H.find(x=>x.t===t); if(hh){lines.push({n:'成本',p:hh.cost,c:'#9AA19F',dash:''}); if(hh.stop) lines.push({n:hh.stop.n,p:hh.stop.p,c:'var(--r-hi-line)',dash:''});}
  let lo=Math.min(...s,...lines.map(l=>l.p)), hi=Math.max(...s,...lines.map(l=>l.p)); const pad=(hi-lo)*.06; lo-=pad; hi+=pad;
  const X=i=>L+i/(s.length-1)*(R-L), Y=p=>T+(hi-p)/(hi-lo)*(B-T);
  let g=`<svg width="100%" viewBox="0 0 ${w} ${h}" role="img">`;
  for(let k=0;k<=4;k++){const p=lo+(hi-lo)*k/4; g+=`<line x1="${L}" x2="${R}" y1="${Y(p)}" y2="${Y(p)}" stroke="#F0ECE4"/><text x="${L-6}" y="${Y(p)+4}" font-size="10" fill="#8A918F" text-anchor="end">${p.toFixed(0)}</text>`}
  const placed=[]; lines.slice().sort((a,b)=>b.p-a.p).forEach(l=>{const y=Y(l.p); let side='R', ty=y-4;
    if(placed.some(q=>q.side==='R'&&Math.abs(q.ty-ty)<12)){side='L'; if(placed.some(q=>q.side==='L'&&Math.abs(q.ty-ty)<12)) ty=y+12;}
    placed.push({side,ty});
    g+=`<line x1="${L}" x2="${R}" y1="${y}" y2="${y}" stroke="${l.c}" stroke-width="1.2" ${l.dash?`stroke-dasharray="${l.dash}"`:''}/><text x="${side==='R'?R:L+4}" y="${ty}" font-size="10" fill="${l.c}" text-anchor="${side==='R'?'end':'start'}" paint-order="stroke" stroke="#fff" stroke-width="3">${l.n} ${usd(l.p)}</text>`});
  g+=`<polyline fill="none" stroke="#1F2A2A" stroke-width="1.8" points="${s.map((p,i)=>`${X(i).toFixed(1)},${Y(p).toFixed(1)}`).join(' ')}"/>`;
  g+=`<circle cx="${X(s.length-1)}" cy="${Y(s[s.length-1])}" r="4" fill="#1F2A2A"/>`;
  g+=`<text x="${L}" y="${h-6}" font-size="10" fill="#8A918F">约 60 个交易日前</text><text x="${R}" y="${h-6}" font-size="10" fill="#8A918F" text-anchor="end">10-22 收盘 ${usd(s[s.length-1])}</text>`;
  return g+'</svg>';
}

   <p>价格距离小于 10% 为重点，10%–20% 为关注；分数距离小于 5 分为重点，5–10 分为关注。</p>

   <p>止盈接近单独列为“止盈提示”，不计入下行风险数。</p><p>组合回撤 = 按收盘估算的总资产 / 历史峰值 − 1；“距历史高点”与刹车距离同一口径。</p>
   <p>空头数据超过 20 个自然日为过期，期权数据超过 2 个交易日为过期。</p><p>页面不给出目标价，只引用已有估值输入。</p></div></details>
  ${foot()}`;
  document.querySelectorAll('[data-stat]').forEach(s=>s.onclick=()=>s.classList.toggle('open'));
}

/* ---------- DESIGN SYSTEM ---------- */
function vDS(){
  const sw=[['画布','--canvas'],['卡片','--card'],['主文字','--ink'],['次文字','--ink2'],['品牌 / 操作','--brand'],['上涨（文字）','--up'],['下跌（文字）','--down'],['重点下行','--r-hi'],['重点下行底','--r-hi-bg'],['下行关注','--r-mid'],['下行关注底','--r-mid-bg'],['止盈提示','--tp'],['止盈提示底','--tp-bg'],['参考线','--ref']];
  const cs=getComputedStyle(document.documentElement);
  $('#main').innerHTML=`<div class="crumb">设计系统</div><h1>颜色只表达一件事</h1>
  <p class="sub">涨跌只用数字的文字颜色；风险等级只用图标 + 底色标签；止盈提示用蓝灰色，不与涨跌、风险混用。</p>
  <div class="card sec"><h2>01 颜色</h2><div class="grid" style="grid-template-columns:repeat(7,1fr)">${sw.map(([n,v])=>`<div><div class="ds-sw" style="background:var(${v})"></div><div class="small">${n}</div><div class="small mono muted">${cs.getPropertyValue(v).trim()}</div></div>`).join('')}</div></div>
  <div class="grid g2 sec">
   <div class="card"><h2>02 字体与数字</h2><div style="font-size:28px;font-weight:650">标题 28 / 650</div><div style="font-size:18px;font-weight:650">卡片标题 18 / 650</div><div>正文 14 / 1.55</div><div class="small">辅助 12</div><div class="num" style="font-size:30px;margin-top:8px">$1,456,525 · −10.6%</div><div class="small muted">中文用系统无衬线字体，数字用系统等宽字体；不加载网络字体。价格 2 位小数带 $，百分比 1–2 位小数。</div></div>
   <div class="card"><h2>03 标签</h2><div class="filters"><span class="chip hi">! 重点下行</span><span class="chip mid">▲ 下行关注</span><span class="chip tp">↗ 止盈提示</span><span class="chip ok">正常</span><span class="chip held">持有</span><span class="chip buy">可买</span><span class="chip miss">暂缺</span><span class="chip stale">过期 · 9/30</span><span class="chip stale">旧闻</span></div>
    <h3 style="margin-top:16px">筛选与排序</h3><div class="filters"><button class="f on">全部持仓<span class="c">13</span></button><button class="f">下行风险<span class="c">8</span></button><button class="f">止盈提示<span class="c">3</span></button></div>
    <div class="small muted" style="margin-top:8px">筛选只改变显示范围，排序只改变顺序，都不改变风险级别和规则结果。</div></div>
  </div>
  <div class="card sec"><h2>04 规则的四种状态</h2><div class="small ink2">风险严重程度（红/橙）和规则执行状态是两套信息，不能只凭颜色判断是否有订单。</div>
   <div class="rules" style="grid-template-columns:repeat(4,1fr)">${[{n:'灾难止损',st:'none',v:'$323.24 → $288.94，还需下跌 10.6%'},{n:'警戒减仓',st:'pending',v:'成长 41.5 < 50',x:'减仓单待成交'},{n:'翻倍分批止盈',st:'hold',v:'$507.93 已高于 $401.06',x:'卖出间隔 1 / 20 天'},{n:'跌破 200 日线减仓',st:'done',v:'连续 10 天 → 门槛 7 天',x:'不再重复'}].map(ruleCard).join('')}</div></div>
  <div class="card sec"><h2>05 价格尺</h2><div class="small ink2">只画适用价位；实心圆 = 触发价，空心圆 ✓ = 已越过的触发价，虚线 = 200 日线参考（核心仓才画）；着色线段 = 现价到最近未触发价位的距离。标签自动上下交错避免重叠。</div>
   <div class="grid g2" style="margin-top:10px">${['AVGO','HD','GOOGL','AMD'].map(t=>{const h=H.find(x=>x.t===t);return `<div class="card tight" style="background:#FAF8F4"><b class="mono">${t}</b> <span class="small muted">${h.type}</span><div>${ruler(h,540)}</div></div>`}).join('')}</div></div>
  <div class="card sec"><h2>06 状态集</h2><div class="grid g3">
   <div class="banner warn" style="margin:0"><b>计划缺失</b><span>当日计划没有生成，沿用前一日持仓并提示，不显示成空仓。</span></div>
   <div class="banner info" style="margin:0"><b>盘中</b><span>盘中 · 截至 14:30 ET · 延迟约 16 分钟；不进入规则 A。</span></div>
   <div class="banner warn" style="margin:0"><b>原因暂不可信</b><span>当日新闻缺失，只引用旧闻并标注。</span></div>
   <div><span class="chip miss">暂缺</span> <span class="small ink2">数值未知，不填零、不画虚构走势。</span></div>
   <div><span class="chip stale">过期 · 结算 9/30</span> <span class="small ink2">有值但超过有效期。</span></div>
   <div><span class="small ink2">部分覆盖：</span><span class="num">3.1%</span> <span class="small muted">（覆盖 3/5）</span></div>
   <div class="empty">当前没有需要关注的下行风险</div><div class="empty">还没有完成的复盘记录</div><div class="empty">没有符合条件的标的</div></div></div>
  <div class="card sec"><h2>07 交互约定</h2><ul class="small" style="margin:0;padding-left:18px;line-height:1.9">
   <li>风险项 / 待成交行 → 定位到持仓行并<b>原位展开</b>条件，高亮 1.4 秒；再次点击行或“收起”恢复。</li>
   <li>主题行 → 展开成员；“在下表只看这个主题”联动下方筛选。</li><li>明细表点击表头排序，再点一次反向；筛选与搜索可以叠加。</li>
   <li>大事卡片、数据状态卡片可展开收起；股票代码处处可点进个股页。</li>
   <li>日期 ‹ › 切换交易日；右上角“收盘 / 盘中”标注数据状态（原型演示 10-23 计划缺失、盘中两种状态）。</li>
   <li>手机宽度（< 760px）：导航横向滚动，持仓行变成两行，价格尺占满一行，条件卡片单列。</li></ul></div>
  ${foot()}`;
}
/* ---------- router ---------- */
function route(){
  const h=location.hash.slice(1)||'account';
  let open=null;
  if(h.startsWith('s/')){S.view='stock';S.stock=h.slice(2).toUpperCase()}
  else if(h.startsWith('account/')){S.view='account';open=h.slice(8).toUpperCase()}
  else S.view=['market','stocks','account','trust','ds'].includes(h)?h:'account';
  header(); ({market:vMarket,stocks:vStocks,account:vAccount,trust:vTrust,stock:vStock,ds:vDS})[S.view](); window.scrollTo(0,0);
  if(open&&$('#row-'+open)){toggleRow(open,true);$('#row-'+open).scrollIntoView({block:'start'})}
}
const order=Object.keys(DATES);
$('#prev').onclick=()=>{const i=order.indexOf(S.date); if(i<=1){toast('原型只含 10-22（正常）和 10-23（计划缺失）两个示例日');return} S.date=order[i-1]; route()};
$('#next').onclick=()=>{const i=order.indexOf(S.date); if(i>=order.length-1){toast('10-23 之后还没有数据');return} S.date=order[i+1]; if(S.view!=='account'){location.hash='account'} route(); toast('示例：10-23 计划缺失状态')};
document.querySelectorAll('.mode button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;route()});
window.addEventListener('hashchange',route); route();
</script>
